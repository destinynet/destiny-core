# Outcomes of an applying aspect (destiny.core.astrology.classical.ApplicationOutcome); MISC, not scored as dignity / debility
Prohibited = Prohibition.
Prohibited.commentBody = {0} applies to {1} by {2}, but before it perfects, {3} reaches {4} first by conjunction. (Prohibition by body)
Prohibited.commentRays = {0} applies to {1} by {2}, but before it perfects, {3} reaches {4} first by {5}. (Prohibition by rays)
Prohibited.commentBodyIngress = {0} applies to {1} by {2}, but before it perfects, {3} reaches {4} first by conjunction; {6} has already changed sign by then. (Prohibition by body)
Prohibited.commentRaysIngress = {0} applies to {1} by {2}, but before it perfects, {3} reaches {4} first by {5}; {6} has already changed sign by then. (Prohibition by rays)
Frustrated = Frustration.
Frustrated.comment = {0} applies to {1} by {2}, but before it perfects, {1} completes {4} with the slower {3} and moves on; {0} is frustrated. (Frustration)
Frustrated.commentIngress = {0} applies to {1} by {2}, but before it perfects, {1} completes {4} with the slower {3} and moves on; {0} is frustrated; {5} has already changed sign by then. (Frustration)
Refrained = Refranation.
Refrained.commentRetrograde = {0} applies to {1} by {2}, but before it perfects, {3} stations retrograde; they come within {4} degrees and then separate. (Refranation)
Refrained.commentDirect = {0} applies to {1} by {2}, but before it perfects, {3} stations direct; they come within {4} degrees and then separate. (Refranation)
Refrained.commentRetrogradeIngress = {0} applies to {1} by {2}, but before it perfects, {3} stations retrograde; they come within {4} degrees and then separate; {5} has already changed sign by then. (Refranation)
Refrained.commentDirectIngress = {0} applies to {1} by {2}, but before it perfects, {3} stations direct; they come within {4} degrees and then separate; {5} has already changed sign by then. (Refranation)
Besieged = Besiegement.
Besieged.commentBodyBody = {0} is besieged between {1} and {4} ({1} by body, {3} degrees away; {4} by body, {6} degrees away), with no planet intervening. (Besiegement)
Besieged.commentBodyRays = {0} is besieged between {1} and {4} ({1} by body, {3} degrees away; {4} by {5} rays, {6} degrees away), with no planet intervening. (Besiegement)
Besieged.commentRaysBody = {0} is besieged between {1} and {4} ({1} by {2} rays, {3} degrees away; {4} by body, {6} degrees away), with no planet intervening. (Besiegement)
Besieged.commentRaysRays = {0} is besieged between {1} and {4} ({1} by {2} rays, {3} degrees away; {4} by {5} rays, {6} degrees away), with no planet intervening. (Besiegement)
